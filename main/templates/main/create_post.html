{% extends 'main/base.html' %}

{% block title %}Create a Post{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
    <h2 class="mb-4">Create a Post</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">
            POST
        </button>
    </form>
</div>
{% endblock %}
